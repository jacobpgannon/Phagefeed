name: PhageFeed daily email

on:
  schedule:
    - cron: "7 15 * * *"      # daily at 15:07 UTC = 7:07 am Pacific in winter, 8:07 am in summer
  workflow_dispatch:           # "Run workflow" button
    inputs:
      test_email:
        description: "Send me a test email with the last 7 days of papers (subscribers get nothing)"
        type: boolean
        default: false

concurrency:
  group: phagefeed-email
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Restore paper database
        uses: actions/cache/restore@v4
        with:
          path: .phagefeed-data
          key: phagefeed-db-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: phagefeed-db-

      - name: Check for new papers and email them
        run: python3 notify.py
        env:
          BUTTONDOWN_API_KEY: ${{ secrets.BUTTONDOWN_API_KEY }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          MAIL_TO: ${{ secrets.MAIL_TO }}
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          APP_URL: ${{ secrets.APP_URL }}
          ONLY_HIGHLIGHTS: ${{ secrets.ONLY_HIGHLIGHTS }}
          TEST_EMAIL: ${{ inputs.test_email }}

      - name: Save paper database
        if: always() && inputs.test_email != true
        uses: actions/cache/save@v4
        with:
          path: .phagefeed-data
          key: phagefeed-db-${{ github.run_id }}-${{ github.run_attempt }}
