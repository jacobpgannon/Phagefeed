name: PhageFeed email alerts

on:
  schedule:
    - cron: "17 * * * *"      # every hour (GitHub may start it a few minutes late)
  workflow_dispatch:           # "Run workflow" button for a test run

concurrency:
  group: phagefeed-email
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Restore paper database
        uses: actions/cache/restore@v4
        with:
          path: .phagefeed-data
          key: phagefeed-db-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: phagefeed-db-

      - name: Check for new papers and email them
        run: python3 notify.py
        env:
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          MAIL_TO: ${{ secrets.MAIL_TO }}
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          APP_URL: ${{ secrets.APP_URL }}
          ONLY_HIGHLIGHTS: ${{ secrets.ONLY_HIGHLIGHTS }}

      - name: Save paper database
        if: always()
        uses: actions/cache/save@v4
        with:
          path: .phagefeed-data
          key: phagefeed-db-${{ github.run_id }}-${{ github.run_attempt }}

